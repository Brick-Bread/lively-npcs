<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Lively NPCs editor</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/editor.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <!-- Shown until the editor has logged in: loading, no link, or an expired link. -->
  <div id="gate" class="gate" role="status" aria-live="polite">
    <div class="gate-card">
      <div class="brand brand-big"><span class="brand-mark" aria-hidden="true"></span><span>Lively NPCs</span></div>
      <div id="gate-body" class="gate-body">
        <div class="spinner" aria-hidden="true"></div>
        <p>Opening the editor…</p>
      </div>
    </div>
  </div>

  <div id="app" class="app" hidden>
    <header class="menubar" id="menubar"></header>
    <aside class="side side-left" id="left" aria-label="Lists and outliner"></aside>
    <main class="stage" id="stage">
      <div class="stage-bar" id="stage-bar"></div>
      <div class="viewport-wrap">
        <div class="viewport" id="viewport" aria-label="3D model"></div>
        <div class="stage-hint" id="stage-hint"></div>
      </div>
    </main>
    <aside class="side side-right" id="right" aria-label="Settings"></aside>
    <section class="timeline" id="timeline" aria-label="Timeline"></section>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="modal-root"></div>
</body>
</html>
