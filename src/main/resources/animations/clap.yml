    right-arm-forward: 65
    right-arm-across: 25
    left-arm-forward: 65
    left-arm-across: 25
  - at: 20
    head-pitch: 6
    right-arm-forward: 62
    right-arm-across: 12
    left-arm-forward: 62
    left-arm-across: 12
