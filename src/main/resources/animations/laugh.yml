# Laugh: head thrown back, shoulders bobbing and the body shaking, a hand on its belly.
# A built-in preset: edit it in the web editor (/npc editor), or copy this file to
# plugins/LivelyNPCs/animations/laugh.yml and change it there. Ticks: 20 a second.
