<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <!-- Lively NPCs 1200x400: drawn by hand for Lively NPCs (the same NPC as icon.svg). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18222d"/>
      <stop offset="1" stop-color="#0c1016"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6fd3a8" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#6fd3a8" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="face2">
      <rect x="100" y="138" width="208" height="208" rx="30"/>
    </clipPath>
    <clipPath id="frame">
      <rect width="1200" height="400"/>
    </clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="400" fill="url(#bg)"/>
    <circle cx="240.0" cy="266.0" r="264.0" fill="url(#glow)"/>
    <g opacity="0.07" stroke="#6fd3a8" stroke-width="2">
      <line x1="430" y1="0" x2="30" y2="400"/><line x1="486" y1="0" x2="86" y2="400"/><line x1="542" y1="0" x2="142" y2="400"/><line x1="598" y1="0" x2="198" y2="400"/><line x1="654" y1="0" x2="254" y2="400"/><line x1="710" y1="0" x2="310" y2="400"/><line x1="766" y1="0" x2="366" y2="400"/><line x1="822" y1="0" x2="422" y2="400"/><line x1="878" y1="0" x2="478" y2="400"/><line x1="934" y1="0" x2="534" y2="400"/><line x1="990" y1="0" x2="590" y2="400"/><line x1="1046" y1="0" x2="646" y2="400"/><line x1="1102" y1="0" x2="702" y2="400"/><line x1="1158" y1="0" x2="758" y2="400"/><line x1="1214" y1="0" x2="814" y2="400"/><line x1="1270" y1="0" x2="870" y2="400"/><line x1="1326" y1="0" x2="926" y2="400"/><line x1="1382" y1="0" x2="982" y2="400"/><line x1="1438" y1="0" x2="1038" y2="400"/><line x1="1494" y1="0" x2="1094" y2="400"/><line x1="1550" y1="0" x2="1150" y2="400"/>
    </g>
    <path d="M400 317 L403.64 326.36 L413 330 L403.64 333.64 L400 343 L396.36 333.64 L387 330 L396.36 326.36 Z" fill="#a6ecd0" opacity="0.9"/><path d="M60 111 L62.52 117.48 L69 120 L62.52 122.52 L60 129 L57.48 122.52 L51 120 L57.48 117.48 Z" fill="#6fd3a8" opacity="0.8"/><path d="M438 80 L440.24 85.76 L446 88 L440.24 90.24 L438 96 L435.76 90.24 L430 88 L435.76 85.76 Z" fill="#cdf5e3" opacity="0.7"/>
    <g transform="translate(40 26) scale(0.8)">

    <!-- the arm hanging down (behind the body) -->
    <rect x="72" y="380" width="54" height="170" rx="18" fill="#4fb88d"/>
    <!-- body: a mint shirt -->
    <rect x="112" y="368" width="184" height="190" rx="26" fill="#6fd3a8"/>
    <rect x="112" y="368" width="184" height="26" rx="13" fill="#8fe2bf"/>

    <!-- the waving arm: sleeve and hand, turned out from the shoulder -->
    <g transform="rotate(17 300 404)">
      <rect x="270" y="214" width="60" height="196" rx="20" fill="#5cc69a"/>
      <rect x="266" y="146" width="68" height="84" rx="22" fill="#f6cfa8"/>
      <rect x="266" y="146" width="68" height="20" rx="10" fill="#ffe1c2"/>
    </g>

    <!-- head -->
    <rect x="100" y="138" width="208" height="208" rx="30" fill="#f6cfa8"/>
    <g clip-path="url(#face2)">
      <!-- hair -->
      <rect x="100" y="138" width="208" height="56" fill="#6b4528"/>
      <rect x="100" y="190" width="34" height="34" fill="#6b4528"/>
      <rect x="274" y="190" width="34" height="34" fill="#6b4528"/>
      <rect x="100" y="138" width="208" height="14" fill="#86593a"/>
      <!-- shade under the chin -->
      <rect x="100" y="326" width="208" height="20" fill="#e9b98f"/>
    </g>
    <!-- eyes -->
    <rect x="142" y="226" width="34" height="40" rx="8" fill="#1b2330"/>
    <rect x="232" y="226" width="34" height="40" rx="8" fill="#1b2330"/>
    <rect x="149" y="232" width="12" height="12" rx="3" fill="#ffffff"/>
    <rect x="239" y="232" width="12" height="12" rx="3" fill="#ffffff"/>
    <!-- cheeks -->
    <rect x="122" y="280" width="30" height="16" rx="8" fill="#ff9c96" opacity="0.6"/>
    <rect x="256" y="280" width="30" height="16" rx="8" fill="#ff9c96" opacity="0.6"/>
    <!-- smile -->
    <path d="M168 282 H240 V292 A36 36 0 0 1 204 328 A36 36 0 0 1 168 292 Z" fill="#3b1f27"/>
    <path d="M184 312 A22 14 0 0 1 224 312 A36 36 0 0 1 204 328 A36 36 0 0 1 184 312 Z" fill="#ff7f86"/>

    <!-- motion lines beside the waving hand -->
    <g fill="none" stroke="#a6ecd0" stroke-width="18" stroke-linecap="round">
      <path d="M396 118 A92 92 0 0 1 452 214"/>
      <path d="M392 64 A150 150 0 0 1 482 196" stroke="#6fd3a8" opacity="0.75"/>
    </g>
  </g>
  </g>
  <g font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif">
    <text x="470" y="190" font-size="104" font-weight="800" fill="#f1f5f9" letter-spacing="-1">Lively <tspan fill="#6fd3a8">NPCs</tspan></text>
    <text x="474" y="246" font-size="29" font-weight="500" fill="#aab8c8">NPCs that look at you, wave, beckon and talk</text>
    <rect x="472" y="292" width="282" height="44" rx="22.0" fill="#6fd3a8" fill-opacity="0.12" stroke="#6fd3a8" stroke-opacity="0.7" stroke-width="2"/>
    <text x="613.0" y="321.92" text-anchor="middle" font-size="22" font-weight="600" fill="#cdf5e3">Web animation editor</text>
    <rect x="768" y="292" width="184" height="44" rx="22.0" fill="#6fd3a8" fill-opacity="0.12" stroke="#6fd3a8" stroke-opacity="0.7" stroke-width="2"/>
    <text x="860.0" y="321.92" text-anchor="middle" font-size="22" font-weight="600" fill="#cdf5e3">Packets only</text>
    <rect x="966" y="292" width="159" height="44" rx="22.0" fill="#6fd3a8" fill-opacity="0.12" stroke="#6fd3a8" stroke-opacity="0.7" stroke-width="2"/>
    <text x="1045.5" y="321.92" text-anchor="middle" font-size="22" font-weight="600" fill="#cdf5e3">Paper 26.3</text>
  </g>
</svg>
